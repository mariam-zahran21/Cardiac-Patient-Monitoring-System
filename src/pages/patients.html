<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>مستشفى القلب التخصصي</title>

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Cairo:wght@200..1000&display=swap"
        rel="stylesheet"
    >

    <style>

        .cairo {
            font-family: "Cairo", sans-serif;
            font-optical-sizing: auto;
            font-weight: 400;
            font-style: normal;
        }

    </style>

</head>


<body class="cairo bg-gray-50">

<div class="min-h-screen flex flex-col lg:flex-row">
        <div id="navbar"></div>

        <div class="flex-1 flex flex-col">

            <div id="header"></div>

          <main class="flex-1 p-4 sm:p-8">

    <section>

        <div class="mb-6">
            <h1 class="text-2xl font-bold text-gray-800">
                المرضى
            </h1>

            <p class="text-sm text-gray-500 mt-1">
                عرض وإدارة معلومات المرضى
            </p>
        </div>


        <div class="bg-white border border-gray-200 rounded-xl overflow-hidden">

            <div class="p-5 border-b border-gray-200">

                <h2 class="text-lg font-bold text-gray-800">
                    قائمة المرضى
                </h2>

            </div>


            <div class="overflow-x-auto">

                <table class="w-full text-sm text-right">

                    <thead class="bg-gray-50 border-b border-gray-200">

                        <tr>

                            <th class="px-5 py-4 font-bold text-gray-600 whitespace-nowrap">
                                اسم المريض
                            </th>

                            <th class="px-5 py-4 font-bold text-gray-600 whitespace-nowrap">
                                العمر
                            </th>

                            <th class="px-5 py-4 font-bold text-gray-600 whitespace-nowrap">
                                الجنس
                            </th>

                            <th class="px-5 py-4 font-bold text-gray-600 whitespace-nowrap">
                                رقم الهاتف
                            </th>

                            <th class="px-5 py-4 font-bold text-gray-600 whitespace-nowrap">
                                الحالة
                            </th>

                            <th class="px-5 py-4 font-bold text-gray-600 whitespace-nowrap">
                                التشخيص
                            </th>
                            <th class="px-5 py-4 font-bold text-gray-600 whitespace-nowrap">
                               زمرة الدم
                            </th>
                            <th class="px-5 py-4 font-bold text-gray-600 whitespace-nowrap">
                             معدل نبضات القلب
                            </th>
                            <th class="px-5 py-4 font-bold text-gray-600 whitespace-nowrap">
                            معدل ضغط الدم                            </th>
                            <th class="px-5 py-4 font-bold text-gray-600 whitespace-nowrap">
         معدل الاكسجين
                            </th>

                        </tr>

                    </thead>


                    <tbody id="patients-table-body" class="divide-y divide-gray-100">

                    </tbody>

                </table>

            </div>

        </div>

    </section>

</main>

            <div id="footer"></div>

        </div>

    </div>


    <script src="../js/components.js"></script>
    <script src="../js/patients.js"></script>
</body>

</html>
